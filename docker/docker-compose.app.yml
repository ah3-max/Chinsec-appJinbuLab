# ============================================
# ChineseLearn — App Overlay
# 疊加在 dev compose 上，新增 Next.js 容器並共用既有 postgres/redis/minio
# 啟動：
#   export $(grep AUTH_SECRET ../.env.local | xargs)
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
# ============================================

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # 一鍵登入按鈕（NEXT_PUBLIC_* 必須在 build-time 傳入才會打包到 client bundle）
        NEXT_PUBLIC_ENABLE_QUICK_LOGIN: "true"
    container_name: chinese-learn-app
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: "3003"
      HOSTNAME: "0.0.0.0"

      # 資料庫 / Redis / MinIO 走容器內部網路
      DATABASE_URL: postgresql://chinese_learn:chinese_learn_dev_pwd@postgres:5432/chinese_learn?schema=public
      REDIS_URL: redis://:chinese_learn_redis_pwd@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: chinese_learn_minio_pwd
      MINIO_BUCKET_AUDIO: chinese-learn-audio
      MINIO_BUCKET_HANDWRITING: chinese-learn-handwriting
      MINIO_BUCKET_HOMEWORK: chinese-learn-homework
      MINIO_BUCKET_VOCAB_IMAGES: chinese-learn-vocab-images

      # ── Image generation provider ──────────────────────────────────────
      # IMAGE_GEN_PROVIDER: openai | lmstudio | gemini  (default openai)
      IMAGE_GEN_PROVIDER: ${IMAGE_GEN_PROVIDER:-openai}

      # OpenAI DALL-E 3
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # LM Studio (OpenAI-compatible /v1/images/generations)
      # Use host.docker.internal so the container can reach a LM Studio on the Mac.
      # If LM Studio runs on another machine on your LAN, put that IP here.
      LM_STUDIO_IMAGE_BASE_URL: ${LM_STUDIO_IMAGE_BASE_URL:-}
      LM_STUDIO_IMAGE_MODEL:    ${LM_STUDIO_IMAGE_MODEL:-gemini-2.5-flash-image}
      LM_STUDIO_API_KEY:        ${LM_STUDIO_API_KEY:-lm-studio-placeholder}

      # Google Gemini 2.5 Flash Image ("nano-banana") — direct API
      GEMINI_API_KEY:     ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image}

      # NextAuth
      AUTH_SECRET: ${AUTH_SECRET:-L2McCVdqUnoFRrbQvUcrWe9wME2WSNW7qRkqgP/cZhU=}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3003

      # 應用設定
      NEXT_PUBLIC_APP_NAME: JinBuLap
      NEXT_PUBLIC_APP_URL: http://localhost:3003
      # 一鍵登入按鈕（僅本機 dev 用，正式部署請設 false 或移除）
      NEXT_PUBLIC_ENABLE_QUICK_LOGIN: "true"
      DEFAULT_LOCALE: zh-TW
      SUPPORTED_LOCALES: zh-TW,en,th,vi,id

      # Other AI services (text/chat models, kept for future router use)
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      OLLAMA_BASE_URL:    ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - chinese-learn-net
    # Allow `host.docker.internal` inside the container — needed for image
    # generation models (LM Studio / Ollama) running on the Mac host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
